name: Apply Arena mouse preview optimization
on:
  push:
    branches: [fix/mouse-aim-preview-lag-20261027]
    paths: [.github/workflows/aim-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          changes=json.loads("[[\"    swipe = null;\\n    constructor(canvas, handlers) {\",\"    swipe = null;\\n    mousePreviewFrame = 0;\\n    pendingMousePreview = null;\\n    lastMousePreviewAt = -Infinity;\\n    flushMousePreview = (now) => {\\n        this.mousePreviewFrame = 0;\\n        if (!this.enabled || !this.pendingMousePreview) return;\\n        if (now - this.lastMousePreviewAt < 30) {\\n            this.mousePreviewFrame = requestAnimationFrame(this.flushMousePreview);\\n            return;\\n        }\\n        const point = this.pendingMousePreview;\\n        this.pendingMousePreview = null;\\n        this.lastMousePreviewAt = now;\\n        this.handlers.onCursor(this.handlers.showAimCursor?.() ? point : null);\\n        this.handlers.onMove(point);\\n    };\\n    constructor(canvas, handlers) {\"],[\"    detach() {\\n        this.canvas.removeEventListener('pointermove', this.move);\",\"    detach() {\\n        cancelAnimationFrame(this.mousePreviewFrame);\\n        this.mousePreviewFrame = 0;\\n        this.pendingMousePreview = null;\\n        this.canvas.removeEventListener('pointermove', this.move);\"],[\"        if (!enabled) {\\n            this.canvas.style.cursor = '';\",\"        if (!enabled) {\\n            cancelAnimationFrame(this.mousePreviewFrame);\\n            this.mousePreviewFrame = 0;\\n            this.pendingMousePreview = null;\\n            this.canvas.style.cursor = '';\"],[\"            this.handlers.onCursor(aiming ? point : null);\\n            this.handlers.onMove(point);\\n            return;\",\"            this.pendingMousePreview = point;\\n            if (!this.mousePreviewFrame)\\n                this.mousePreviewFrame = requestAnimationFrame(this.flushMousePreview);\\n            return;\"]]")
          for filename in ('index.html','Arena game.html'):
              p=Path(filename)
              s=p.read_text()
              for a,b in changes:
                  assert s.count(a)==1,(filename,a[:40])
                  s=s.replace(a,b)
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "Arena game.html"
          git rm .github/workflows/aim-fix.yml
          git commit -m "fix: coalesce mouse aiming previews"
          git push
