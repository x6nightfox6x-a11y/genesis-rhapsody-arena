<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Arena</title>
<p>正在打开 Arena… <a id="open" href="index.html">点击进入游戏</a></p>
<script>
const target=new URL('index.html',location.href);target.search=location.search;target.hash=location.hash;
try{const prefix='arena-cathedral-blank-v2:',old=localStorage.getItem(prefix+encodeURIComponent(location.pathname));if(old&&!localStorage.getItem(prefix+encodeURIComponent(target.pathname)))localStorage.setItem(prefix+encodeURIComponent(target.pathname),old);}catch{}
document.getElementById('open').href=target.href;location.replace(target.href);
</script></html>
