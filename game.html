<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis Rhapsody Arena | Game</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#100d13;color:#f4e8d5;font:15px system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;background:#221a28;border-bottom:1px solid #59475d;padding:10px 18px;gap:15px}header strong{color:#e6c38b;letter-spacing:1px}a{color:#e6c38b;text-decoration:none}button{cursor:pointer;background:#5f4639;color:#fff2dc;border:1px solid #8c6c52;border-radius:8px;padding:13px 24px;font-weight:600}.hero{min-height:calc(100dvh - 50px);display:grid;place-content:center;text-align:center;padding:20px;background:radial-gradient(ellipse at 50% 25%,#38283b,transparent 70%)}.hero h1{font:clamp(30px,5vw,70px) Georgia,serif;letter-spacing:3px;margin:0 0 10px}.hero p{opacity:.7}.hero button{margin-top:28px;font-size:19px}#battle{display:none;height:calc(100dvh - 52px)}iframe{height:100%;width:100%;border:0;background:#100d13}#exit{display:none}body.playing .hero{display:none}body.playing #battle{display:block}body.playing #exit{display:inline-block}.note{font-size:12px;opacity:.7;max-width:500px;margin:15px auto}@media(max-width:650px){header strong{font-size:12px}header a{font-size:12px}}</style></head><body><header><strong>✦ GENESIS RHAPSODY ARENA</strong><span><button id="exit" onclick="leave()">返回主菜单</button> <a href="studio.html">开发者 Studio</a></span></header><main class="hero"><h1>GENESIS<br>RHAPSODY<br>ARENA</h1><p>战略战棋 · 游戏模式</p><button onclick="play()">开始游戏</button><div class="note">当前为玩家版原型：共用现有 Arena 战斗系统，正式战役和玩家菜单尚在开发中。</div></main><div id="battle"><iframe id="arena" title="GRA 战棋" loading="lazy"></iframe></div><script>function play(){document.body.classList.add('playing');let f=document.getElementById('arena');if(!f.src)f.src='Arena%20game.html'}function leave(){document.body.classList.remove('playing')}</s
