<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRA Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#111017;color:#f3e9d6;font:14px system-ui,sans-serif}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#211b27;border-bottom:1px solid #655263}h1{font-size:18px;margin:0;color:#e5c18a}button{border:1px solid #766379;background:#302538;color:#fff0d7;padding:9px 14px;border-radius:7px;cursor:pointer}button:hover{background:#52405b}.primary{background:#695035}.active{background:#735843}#status{color:#d3c18e;font-size:12px;margin-left:auto}#studioLang{background:#302538;color:#fff0d7;border:1px solid #766379;border-radius:6px;padding:7px}.panels{display:flex;height:calc(100dvh - 65px);position:relative}.panels #side{display:none}.panels.library-open #side{display:block;position:absolute;z-index:100;top:0;bottom:0;left:0;box-shadow:10px 0 35px #0009}#side{width:220px;max-width:88vw;flex-shrink:0;background:#191820;border-right:1px solid #554755;padding:16px;overflow:auto}h2{font-size:15px;color:#e5c18a}small{color:#ab9eac}.card-grid{display:flex;flex-direction:column;gap:6px;margin-top:10px}.library-controls{display:flex;flex-direction:column;gap:6px;margin:10px 0}.library-controls input,.library-controls select{min-width:0;background:#251e2c;color:#fff2da;border:1px solid #67556d;border-radius:6px;padding:9px;flex:1}.card-preview{width:56px;height:56px;flex:0 0 56px;display:grid;place-content:center;background:radial-gradient(circle,#342c39,#17141e);border-radius:7px;margin-bottom:9px;overflow:hidden}.card-preview canvas{max-width:52px;max-height:52px;image-rendering:pixelated}.card-actions{display:flex;gap:3px;grid-column:2;flex-wrap:nowrap}.card-actions button{flex:1;white-space:nowrap;font-size:11px;padding:5px 3px;min-width:0}.library-footer{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-top:12px}.library-footer button{font-size:11px;padding:6px 4px}.entry{display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:8px;align-items:center;border:1px solid #4b4453;border-radius:8px;margin:9px 0;padding:10px;overflow-wrap:anywhere}.entry strong{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}.entry button{font-size:12px;padding:7px;margin:2px}.main{flex:1;min-width:0}#saveCard,#saveAndPlay{display:none}body.editor-mode #saveCard,body.editor-mode #saveAndPlay{display:inline-block}iframe{width:100%;height:100%;border:0;background:#100e14;display:none}iframe.active{display:block}#empty{color:#a99bb2} @media(max-width:700px){header{gap:5px}#status{width:100%;margin:0}.panels{height:calc(100dvh - 103px)}#side{width:190px;padding:8px}button{padding:7px}h1{font-size:14px}}
body.testing header{display:none}#endTest{display:none}body.testing #endTest{display:block;position:fixed;z-index:999999;top:9px;left:9px;background:#211b27cc}body.testing .panels{height:100dvh!important}body.testing #side{display:none!important}body.testing .main{width:100vw}body.testing #arena{display:block!important}body.testing #editor{display:none!important}body.testing #saveCard,body.testing #saveAndPlay{display:none!important}</style></head><body><header><h1>✦ GRA STUDIO</h1><button id="testGame" class="primary">▶ 游戏测试</button><button id="arenaTab" class="active">⚔ Arena</button><button id="editorTab">♜ ID Studio</button><button id="libraryToggle" aria-expanded="false">☰ 角色库</button><button id="saveCard" class="primary">💾 保存角色</button><button id="saveAndPlay">▶ 保存并测试</button><span id="status">统一角色库载入中…</span><select id="studioLang" aria-label="界面语言" title="切换中英文"><option value="zh">中文</option><option value="en">English</option></select></header><button id="endTest" aria-label="返回开发后台">← 返回后台</button><div class="panels" id="panels"><aside id="side"><h2>GRA 角色库</h2><small>选择角色编辑。保存后可立即进入 Arena 测试。</small><div class="library-controls"><input id="cardSearch" placeholder="搜索角色名 / ID…" aria-label="搜索角色"><select id="cardSort" aria-label="角色排序"><option value="recent">最近修改</option><option value="name">名称 A-Z</option></select></div><small id="cardCount"></small><div id="cards" class="card-grid"></div><p id="empty">暂无匹配的角色</p><div class="library-footer"><button id="prevPage">← 上一页</button><small id="pageInfo"></small><button id="nextPage">下一页 →</button></div></aside><div class="main"><iframe id="arena" title="GRA Arena" src="index.html" class="active"></iframe><iframe id="editor" title="GRA ID Studio" src="Downbeat_ID_Card_Studio.html"></iframe></div></div><script>
'use strict';const $=id=>document.getElementById(id), dbName='gra-unified-studio',store='cards';let db;
function status(t){$('status').textContent=t}function connect(){return new Promise((res,rej)=>{let q=indexedDB.open(dbName,1);q.onupgradeneeded=()=>{q.result.createObjectStore(store,{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function tx(mode){return db.transaction(store,mode).objectStore(store)}
function save(id,card){return new Promise((res,rej)=>{let r=tx('readwrite').put({id,card,updated:Date.now()});r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function get(id){return new Promise((res,rej)=>{let r=tx('readonly').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function all(){return new Promise((res,rej)=>{let r=tx('readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tab(which){document.body.classList.toggle('editor-mode',which==='editor');if(which==='arena'){setLibrary(false)}for(let id of ['arena','editor']){$(id).classList.toggle('active',id===which);$(id+'Tab').classList.toggle('active',id===which)}}
function setLibrary(open){$('panels').classList.toggle('library-open',open);$('libraryToggle').setAttribute('aria-expanded',String(open));$('libraryToggle').textContent=open?'✕ 收起角色库':'☰ 角色库'}
$('libraryToggle').onclick=()=>setLibrary(!$('panels').classList.contains('library-open'));

$('testGame').onclick=()=>{try{const deployment=$('arena').contentWindow.DBDeployment;if(deployment?.active){deployment.setDefaultRoster();deployment.commit()}tab('arena');setLibrary(false);document.body.classList.add('testing');status('游戏测试中')}catch(e){status('无法开始测试：'+e.message)}};$('endTest').onclick=()=>{document.body.classList.remove('testing');try{const d=$('arena').contentWindow.DBDeployment;if(d&&!d.active)d.begin();status('已返回部署后台')}catch(e){status('返回后台：'+e.message)}};
$('arenaTab').onclick=()=>tab('arena');$('editorTab').onclick=()=>tab('editor');
let page=0;const pageSize=18;let libraryEntries=[];
function preview(canvas,card){
 const data=typeof card.sheet==='string'?card.sheet:null;
 if(!data||!data.startsWith('data:image/')){canvas.replaceWith(document.createTextNode('无预览'));return}
 const image=new Image();image.onload=()=>{
 const width=Number(card.layout?.cellWidth)||Math.min(image.width,192);
 const height=Number(card.layout?.cellHeight)||Math.min(image.height,192);
 canvas.width=Math.max(1,Math.min(width,image.width));canvas.height=Math.max(1,Math.min(height,image.height));
 const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
 ctx.drawImage(image,0,0,canvas.width,canvas.height,0,0,canvas.width,canvas.height);
 };image.onerror=()=>canvas.replaceWith(document.createTextNode('预览不可用'));image.src=data;
}
function refreshLibrary(){
 const q=$('cardSearch').value.trim().toLocaleLowerCase();
 let matches=libraryEntries.filter(e=>String(e.card.name||e.id).toLocaleLowerCase().includes(q)||String(e.id).toLocaleLowerCase().includes(q));
 if($('cardSort').value==='name')matches.sort((a,b)=>String(a.card.name||a.id).localeCompare(String(b.card.name||b.id),'zh'));
 else matches.sort((a,b)=>b.updated-a.updated);
 const pages=Math.max(1,Math.ceil(matches.length/pageSize));page=Math.min(page,pages-1);
 $('cardCount').textContent='共 '+libraryEntries.length+' 张 · 匹配 '+matches.length+' 张';
 $('pageInfo').textContent=(page+1)+' / '+pages;
 $('prevPage').disabled=page===0;$('nextPage').disabled=page>=pages-1;
 $('empty').hidden=matches.length>0;
 const host=$('cards');host.replaceChildren();
 for(const entry of matches.slice(page*pageSize,(page+1)*pageSize)){
 const node=document.createElement('div');node.className='entry';
 const visual=document.createElement('div');visual.className='card-preview';const canvas=document.createElement('canvas');visual.append(canvas);node.append(visual);
 const name=document.createElement('strong');name.textContent=entry.card.name||entry.id;node.append(name);
 const actions=document.createElement('div');actions.className='card-actions';
 const use=document.createElement('button');use.textContent='⚔ 上场';use.onclick=()=>apply(entry.id);actions.append(use);
 const edit=document.createElement('button');edit.textContent='✎ 编辑';edit.onclick=()=>editCard(entry.id);actions.append(edit);
 node.draggable=true;node.title='拖到地图放置角色';node.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',entry.id);e.dataTransfer.effectAllowed='copy';window.graDraggingId=entry.id});node.append(actions);host.append(node);preview(canvas,entry.card);
 }
}
$('cardSearch').addEventListener('input',()=>{page=0;refreshLibrary()});
$('cardSort').addEventListener('change',()=>{page=0;refreshLibrary()});
$('prevPage').onclick=()=>{if(page>0){page--;refreshLibrary()}};
$('nextPage').onclick=()=>{page++;refreshLibrary()};
async function render(){libraryEntries=await all();refreshLibrary()}
let currentEditingId=null;
async function editCard(id){
 try{
 const entry=await get(id);if(!entry)throw Error('角色不存在');
 const w=$('editor').contentWindow,input=w.document.getElementById('cardFile');
 if(!input||!input.onchange)throw Error('ID Studio 尚未加载完成');
 const file=new File([JSON.stringify(entry.card)],id+'.downbeat.json',{type:'application/json'});
 const transfer=new DataTransfer();transfer.items.add(file);input.files=transfer.files;
 await input.onchange({target:input});currentEditingId=id;
 tab('editor');setLibrary(false);
 status('✓ '+id+' 已载入 ID Studio，可修改并保存');
 }catch(e){console.error(e);status('打开角色失败：'+e.message)}
}
async function saveCurrent(play){
 try{
 const w=$('editor').contentWindow;
 if(typeof w.warmSprites==='function')await w.warmSprites();
 if(typeof w.normalized!=='function')throw Error('ID Studio 未载入');
 const obj=w.normalized(),card=obj?.card||obj;
 if(!card||typeof card!=='object'||card.format!=='downbeat-character')throw Error('未能获取有效的角色卡');
 const id=currentEditingId||String(card.name||'id-'+Date.now()).replace(/[^\w\u4e00-\u9fff-]/g,'_').slice(0,100);
 await save(id,card);currentEditingId=id;await render();
 status('✓ 已保存 '+(card.name||id)+' 到 GRA 本地角色库');
 if(play)await apply(id);
 }catch(e){console.error(e);status('保存失败：'+e.message)}
}
$('saveCard').onclick=()=>saveCurrent(false);
$('saveAndPlay').onclick=()=>saveCurrent(true);
async function apply(id){try{let entry=await get(id);if(!entry)throw Error('角色不存在');let frame=$('arena'),w=frame.contentWindow;if(!w.document.getElementById('arenaIDFile'))throw Error('Arena 未加载完成');let file=new File([JSON.stringify(entry.card)],id+'.json',{type:'application/json'}),dt=new DataTransfer();dt.items.add(file);let input=w.document.getElementById('arenaIDFile');input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));tab('arena');status('正在应用 '+(entry.card.name||id)+'，请检查 Arena 角色 ID 插槽提示')}catch(e){status('应用失败：'+e.message)}}

function configureArenaPresentation(){
 try{
 const win=$('arena').contentWindow,doc=win.document;
 const style=doc.createElement('style');style.id='gra-studio-presentation';style.textContent='#arenaIDSlot,#arenaDisplaySettings,#arenaLeftDock #arenaLanguage{display:none!important}#arenaLeftDock{pointer-events:none!important}';doc.head.append(style);
 const select=$('studioLang');
 if(win.ArenaLocale){select.value=win.ArenaLocale.language;select.onchange=()=>win.ArenaLocale.set(select.value)}
 }catch(error){console.warn('Arena presentation:',error)}
}
$('arena').addEventListener('load',configureArenaPresentation);

let graSelectedUnit=null;
function graSetupDeployment(){
 const w=$('arena').contentWindow,d=w.document;
 if(!w.DBDeployment||!w.DBDeployment.canvas){return false}
 const api=w.DBDeployment,canvas=api.canvas;
 if(canvas.dataset.graBound)return true;
 canvas.dataset.graBound='1';
 try{if(!api.active)api.begin()}catch(e){status('部署模式启动失败：'+e.message);return false}
 // Drag cards from the library onto the map. The game frame shares this site's origin.
 d.addEventListener('dragover',e=>{if(!window.graDraggingId)return;e.preventDefault();e.dataTransfer.dropEffect='copy'},true);
 d.addEventListener('drop',async e=>{
  if(!window.graDraggingId)return;
  e.preventDefault();e.stopImmediatePropagation();
  const id=window.graDraggingId;window.graDraggingId=null;
  try{
   if(!api.active)throw Error('请先返回后台');
   if(api.inspect().units.length>=40)throw Error('地图最多 40 人');
   const record=await get(id);if(!record)throw Error('角色未找到');
   const p=api.point({clientX:e.clientX,clientY:e.clientY,target:canvas});
   const card=record.card;
   const unit=api.make({id:'gra-'+Date.now()+'-'+Math.floor(Math.random()*10000),type:'leon',team:'ally',name:card.name||id,x:p.x,y:p.y});
   if(w.ArenaRuntime?.prepare)await w.ArenaRuntime.prepare(card);
   if(w.ArenaID?.apply)w.ArenaID.apply(unit,card);
   api.replace([...api.inspect().units,unit]);
   graSelectedUnit=unit.id;api.choose(unit.id);
   status('✓ '+(card.name||id)+' 已放置在地图');
  }catch(err){status('放置角色失败：'+err.message)}
 },true);
 // Track selected unit by clicking the map, but leave dragging/movement to Arena deployment.
 canvas.addEventListener('pointerdown',e=>{
  if(!api.active||document.body.classList.contains('testing'))return;
  try{
   const p=api.point(e),units=api.inspect().units;
   const hit=units.find(u=>Math.hypot(u.pos.x-p.x,u.pos.y-p.y)<(u.def.radius||.5)+.15);
   graSelectedUnit=hit?.id||null;
  }catch{}
 },true);
 d.addEventListener('keydown',e=>{
  if(!api.active||document.body.classList.contains('testing')||!['Delete','Backspace'].includes(e.key))return;
  if(e.target.closest('input,textarea,select,[contenteditable=true]'))return;
  if(!graSelectedUnit)return;
  e.preventDefault();e.stopImmediatePropagation();
  const old=api.inspect().units,match=old.find(x=>x.id===graSelectedUnit);
  if(match){api.replace(old.filter(x=>x.id!==graSelectedUnit));status('已从地图移除 '+match.def.name);graSelectedUnit=null}
 },true);
 return true;
}
function graWaitForDeployment(){
 let attempts=0;
 const timer=setInterval(()=>{if(graSetupDeployment()||++attempts>50)clearInterval(timer)},300);
}
$('arena').addEventListener('load',graWaitForDeployment);
async function loadPublishedCards(){
const filenames=['Jay.downbeat.json','LEON.downbeat.json','白面神官.downbeat.json'];
let added=0,failed=0;
for(const filename of filenames){
 try{
  const res=await fetch('角色卡/'+encodeURIComponent(filename),{cache:'no-cache'});
  if(!res.ok)throw Error('HTTP '+res.status);
  const card=await res.json();
  if(card.format!=='downbeat-character')throw Error('不是角色 ID 格式');
  const id=String(card.name||filename.replace('.downbeat.json',''));
  if(!(await get(id))){await save(id,card);added++}
 }catch(e){console.warn('角色卡载入失败',filename,e);failed++}
}
await render();
status('已加载 GitHub 角色库：'+filenames.length+' 张，新增 '+added+' 张'+(failed?'，失败 '+failed+' 张':''));
}
connect().then(async d=>{db=d;await render();await loadPublishedCards()}).catch(e=>status('角色库不可用：'+e.message));
</script></body></html>
